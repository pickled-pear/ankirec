[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankirec"
version = "1.2.2"
readme = "README.md"
description = "A tool for helping create your own anki flashcards, with screen and sound recording."
dependencies = ["click", "pynput", "rich", "requests", "mss", "pillow", "miniaudio", "edge-tts>=7.3.1"]

[project.optional-dependencies]
windows = ["soundcard", "soundfile", "pywin32"]
linux = []

[project.scripts]
ankirec = "ankirec.__main__:cli"
arec = "ankirec.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ankirec = ["audio/sfx/**/*"]